version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      order-api:
        condition: service_healthy  
    networks:
      - order-network

  mongodb:
    image: mongo:7.0.12
    environment:
      MONGO_INITDB_DATABASE: order_db
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init.sh:/docker-entrypoint-initdb.d/mongodb-init.sh
    ports:
      - "27017:27017"
    command: ["/docker-entrypoint-initdb.d/mongodb-init.sh"]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - order-network

  rabbitmq:
    image: rabbitmq:3.13.7-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - order-network

  
  tempo: 
    image: grafana/tempo:latest
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"  # http api
      - "4317:4317" # OTLP gRPC
    networks:
      - order-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
    networks:
      - order-network

volumes:
  mongodb_data:

networks:
  order-network:
    driver: bridge